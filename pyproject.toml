[project]
name = "archive-tool"
version = "0.1.0"
description = "photo-archive/ 정리 CLI — ingest / export / check / status"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
archive-tool = "archive_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archive_tool*"]
